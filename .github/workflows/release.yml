name: Release

# Ein Tag "v<version>" baut das Zip und haengt es an eine GitHub-Release.
# Der Bau prueft selbst, dass genau ein Ordner "CCAlarm" im Zip liegt --
# ein falscher Ordnername ist der haeufigste Grund, warum ein Addon beim
# Nutzer nicht laedt.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Das Geheimnis muss hier heraufgezogen werden, damit der Upload-Schritt
    # unten ueberhaupt pruefen kann, ob es gesetzt ist: Der `secrets`-Kontext
    # ist in `steps[*].if` NICHT verfuegbar (erlaubt sind dort nur github,
    # needs, strategy, matrix, job, runner, env, vars, steps, inputs). Eine
    # Bedingung `if: secrets.CF_API_TOKEN != ''` waere nie wahr geworden, und
    # der Upload waere stillschweigend nie gelaufen.
    env:
      # BEIDE Namen, und das ist kein Guertel-und-Hosentraeger, sondern noetig:
      # packager@v2 (SHA 6d50adb) liest AUSSCHLIESSLICH CF_API_KEY --
      #   [ -z "$cf_token" ] && cf_token=$CF_API_KEY
      # Erst master nimmt zusaetzlich CF_API_TOKEN an, und genau das beschreibt
      # die aktuelle Doku. Mit nur CF_API_TOKEN blieb der Token leer und der
      # Upload stieg lautlos aus (Issue #20). CF_API_TOKEN bleibt stehen, damit
      # ein spaeterer Sprung auf eine neuere Packager-Fassung nichts bricht.
      CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Voller Verlauf: ohne ihn hat die Vorfahrenpruefung unten keine
          # gemeinsame Basis mit main und schluege immer fehl.
          fetch-depth: 0
      - name: Lua 5.1 installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      # Ein Release darf nie schwaecher geprueft sein als ein gewoehnlicher Push.
      # Vorher liefen hier drei von sieben Gattern -- und die Syntaxpruefung
      # liess Config.lua und die Saatliste aus.
      - name: Nicht ohne gruene Pruefungen ausliefern
        run: |
          luac5.1 -p CCAlarm.lua Locales.lua Config.lua Data/CCSpells.lua tests/pruefstand.lua
          lua5.1 tests/pruefstand.lua
          python3 tools/check_scope.py
          python3 tools/check_toc.py
          python3 tools/check_selfcontained.py
          python3 tools/check_locales.py
          python3 tools/check_privacy.py
          python3 tools/check_secret_auras.py
      # Stehende Regel: der Tag gehoert auf den Merge-Commit auf main, nicht auf
      # die Zweigspitze, die geprueft wurde. Heruntergeladen wird am Ende, was
      # auf main gelandet ist -- also hier nachweisen, dass genau das getaggt ist.
      - name: Tag muss auf main liegen
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Der Tag zeigt auf einen Commit, der nicht auf main liegt." >&2
            exit 1
          fi
      - name: Tag und .toc-Version muessen uebereinstimmen
        run: |
          toc="$(grep -m1 '^## Version:' CCAlarm.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$toc" != "$tag" ]; then
            echo "Tag $tag passt nicht zur .toc-Version $toc" >&2
            exit 1
          fi
      - name: Paket bauen
        run: tools/package.sh
      # Nur der Abschnitt dieser Fassung, nicht der ganze Changelog.
      - name: Releasetext erzeugen
        run: python3 tools/release_notes.py "${GITHUB_REF_NAME}" dist/release-notes.md
      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: dist/release-notes.md
      # Zuletzt, und mit Absicht: CurseForge bekommt nur, was alle Gatter oben
      # bestanden hat. Die Projekt-ID steht in der .toc als X-Curse-Project-ID,
      # damit sie an genau EINER Stelle gepflegt wird -- deshalb kein -p hier.
      #
      # Der Packager baut sein eigenes Zip nach .pkgmeta. Das ist nicht dasselbe
      # wie dist/*.zip aus package.sh, aber beide schliessen docs und
      # Media/logo.png aus.
      #
      # Die Bedingung haelt ein Release am Leben, solange der Token noch fehlt:
      # ohne CF_API_TOKEN wuerde der Schritt scheitern und ein sonst fehlerfreies
      # Release an der letzten Zeile umkippen.
      # Der Riegel gegen den stillen Fehlschlag aus Issue #20. upload_curseforge()
      # kehrt bei leerem oder unbrauchbarem Token mit `return 0` zurueck -- ohne
      # Meldung, ohne Fehlercode. Der Release sah vollstaendig aus, und bei den
      # Nutzern kam nichts an. Deshalb wird der Token vorher geprueft: Ein
      # Release, das nicht ausliefern kann, soll laut scheitern.
      - name: CurseForge-Token pruefen
        if: env.CF_API_KEY != ''
        run: |
          antwort=$(curl -sS -H "x-api-token: $CF_API_KEY" \
                    "https://wow.curseforge.com/api/game/wow/versions")
          if [ -z "$antwort" ] || [[ "$antwort" == *errorMessage* ]]; then
            echo "CurseForge lehnt den Token ab:" >&2
            echo "$antwort" | head -c 400 >&2
            exit 1
          fi
          echo "Token gilt, CurseForge kennt $(echo "$antwort" | jq 'length') Spielversionen."
      - name: Zu CurseForge hochladen
        if: env.CF_API_KEY != ''
        uses: BigWigsMods/packager@v2
